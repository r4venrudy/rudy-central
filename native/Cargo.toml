[package]
name = "rudy-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
description = "Authorized Linux kernel telemetry for Rudy Central"

[features]
default = []
kernel = ["dep:libbpf-rs", "dep:libc", "dep:signal-hook"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = { version = "0.26.2", optional = true }
libc = { version = "0.2", optional = true }
signal-hook = { version = "0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
