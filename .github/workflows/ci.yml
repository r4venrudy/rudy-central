name: Validate Rudy Central
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  evidence-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: r4venrudy/rudy-evidence
          ref: 9a7dc387b9d265de1f98e3b356c8f0d58bb67caa
          path: .sdk
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: cmake -S .sdk -B .sdk/build -DRE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .sdk/build --parallel 2
      - run: npm ci
      - name: Real native conversion and import boundary tests
        run: RUDY_EVIDENCE_CLI="$PWD/.sdk/build/rudy-evidence" node --test tests/evidence-sdk.test.mjs
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm audit --audit-level=high
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --features kernel --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml --features kernel
      - run: cargo build --locked --release --manifest-path native/Cargo.toml --features kernel
      - run: npm ci
      - name: Real kernel load, privilege drop, event limits and signed API round trip
        run: node scripts/kernel-smoke.mts
      - name: Package the tested Linux agent
        run: |
          mkdir -p work/linux-package
          cp native/target/release/rudy-agent work/linux-package/
          cp docs/KERNEL.md work/linux-package/
          cp work/kernel-validation.json work/linux-package/
          cd work/linux-package
          sha256sum rudy-agent > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rudy-agent-linux-x86_64
          path: work/linux-package/
          retention-days: 30
          if-no-files-found: error
